<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Vitrine — Grade de Produtos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  /* Container principal dos produtos */
#grade {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 2rem;
  max-width: 1200px;
  margin: 2rem auto;
  padding: 0 1.5rem;
}

/* Card individual do produto */
.produto-card {
  background: #ffffff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  display: flex;
  flex-direction: column;
  border: 1px solid #f0f0f0;
}

.produto-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
}

/* Imagem do produto */
.produto-card img {
  width: 100%;
  height: 280px;
  object-fit: cover;
  border-bottom: 1px solid #f5f5f5;
}

/* Conteúdo interno do card */
.produto-info {
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
}

.produto-card h3 {
  font-size: 1.1rem;
  color: #1a1a1a;
  margin: 0 0 0.5rem 0;
  font-weight: 600;
}

.produto-card .preco {
  font-size: 1.25rem;
  color: #0f766e; /* Cor elegante para destaques/preço */
  font-weight: 700;
  margin: 0 0 1rem 0;
}

/* Botão de compra/sacola */
.btn-comprar {
  margin-top: auto;
  width: 100%;
  padding: 0.75rem;
  background-color: #18181b;
  color: #ffffff;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.2s ease;
}

.btn-comprar:hover {
  background-color: #3f3f46;
}


  :root{
    --bg: #F2F0EB;
    --surface: #FFFFFF;
    --ink: #14151A;
    --ink-soft: #6B6A66;
    --line: #E4E1D9;
    --accent: #1F5C4D;      /* verde verdigris — cor de assinatura */
    --accent-soft: #E4EEEA;
    --tag: #C97A3D;         /* laranja queimado do "furo da etiqueta" */
    --radius: 2px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header{
    padding: 28px 16px 18px;
    border-bottom: 1px solid var(--line);
  }

  header .eyebrow{
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin: 0 0 6px;
  }

  header h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(28px, 6vw, 40px);
    margin: 0;
    letter-spacing: -0.01em;
  }

  header p{
    margin: 8px 0 0;
    color: var(--ink-soft);
    font-size: 14px;
    max-width: 46ch;
  }

  main{
    padding: 20px 16px 48px;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* GRADE — mobile first: 2 colunas */
  .grade{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px 12px;
  }

  @media (min-width: 560px){
    .grade{ grid-template-columns: repeat(3, 1fr); gap: 18px 16px; }
  }
  @media (min-width: 860px){
    .grade{ grid-template-columns: repeat(4, 1fr); gap: 22px 20px; }
  }
  @media (min-width: 1140px){
    .grade{ grid-template-columns: repeat(5, 1fr); }
  }

<body>

<header>
  <p class="eyebrow">Catálogo</p>
  <h1>Novidades da semana</h1>
  <p>Toque em uma peça para ver detalhes, tamanhos e disponibilidade.</p>
</header>

<main>
  <div class="grade" id="grade" aria-live="polite">
    <!-- os cards são inseridos aqui via JS -->
  </div>
</main>

<footer>Preços sujeitos a alteração sem aviso prévio.</footer>

<script>
  // Variáveis globais de estado
  let listaProdutos = [];
  let produtoSelecionado = null;
  let tamanhoSelecionado = null;

  async function carregarProdutos() {
    try {
      const resposta = await fetch('/api/produtos');
      
      if (!resposta.ok) {
        throw new Error(`Erro HTTP: ${resposta.status}`);
      }

      listaProdutos = await resposta.json();

      const grade = document.getElementById('grade');
      if (!grade) return;
      grade.innerHTML = '';

      listaProdutos.forEach(produto => {
        const precoFormatado = Number(produto.preco).toLocaleString('pt-BR', {
          style: 'currency',
          currency: 'BRL'
        });

        const card = document.createElement('div');
        card.className = 'produto-card';
        card.onclick = () => abrirModal(produto.id);

        card.innerHTML = `
          <img src="${produto.foto}" alt="${produto.nome}" loading="lazy" />
          <div class="produto-info">
            <h3>${produto.nome}</h3>
            <p class="preco">${precoFormatado}</p>
            <button class="btn-comprar" onclick="event.stopPropagation(); abrirModal(${produto.id})">Ver Detalhes</button>
          </div>
        `;

        grade.appendChild(card);
      });
    } catch (erro) {
      console.error('Erro ao carregar os produtos:', erro);
      const grade = document.getElementById('grade');
      if (grade) {
        grade.innerHTML = '<p class="estado-erro">Não foi possível carregar os produtos no momento.</p>';
      }
    }
  }

  // Funções de Controle do Modal
  function abrirModal(id) {
    const produto = listaProdutos.find(item => item.id === id);
    if (!produto) return;

    // Reseta o estado para o novo produto
    produtoSelecionado = produto;
    tamanhoSelecionado = null;

    const precoFormatado = Number(produto.preco).toLocaleString('pt-BR', {
      style: 'currency',
      currency: 'BRL'
    });

    // Atualiza elementos fixos
    document.getElementById('modal-img').src = produto.foto;
    document.getElementById('modal-titulo').innerText = produto.nome;
    document.getElementById('modal-preco').innerText = precoFormatado;
    
    // Atualiza Descrição
    const elDescricao = document.getElementById('modal-descricao');
    if (elDescricao) {
      elDescricao.innerText = produto.descricao || 'Sem descrição detalhada disponível para este produto.';
    }

    // Renderiza Botões de Tamanhos
    const containerTamanhos = document.getElementById('modal-tamanhos');
    if (containerTamanhos) {
      containerTamanhos.innerHTML = '';

      if (produto.tamanhos) {
        const listaTamanhos = produto.tamanhos.split(',').map(t => t.trim());

        listaTamanhos.forEach(tamanho => {
          const btnTamanho = document.createElement('button');
          btnTamanho.type = 'button';
          btnTamanho.className = 'btn-tamanho';
          btnTamanho.innerText = tamanho;

          btnTamanho.onclick = () => {
            document.querySelectorAll('.btn-tamanho').forEach(b => b.classList.remove('ativo'));
            btnTamanho.classList.add('ativo');
            tamanhoSelecionado = tamanho; // Atualiza o estado
          };

          containerTamanhos.appendChild(btnTamanho);
        });
      } else {
        containerTamanhos.innerHTML = '<span style="color: #777; font-size: 0.9rem;">Tamanho único</span>';
      }
    }

    // Exibe o modal
    document.getElementById('modal-produto').classList.remove('hidden');
  }

  function fecharModal() {
    document.getElementById('modal-produto').classList.add('hidden');
    produtoSelecionado = null;
    tamanhoSelecionado = null;
  }

  // Adicionar à Sacola com LocalStorage
  function adicionarASacola() {
    if (!produtoSelecionado) return;

    // Validação de seleção de tamanho
    if (produtoSelecionado.tamanhos && !tamanhoSelecionado) {
      alert('Por favor, selecione um tamanho antes de adicionar à sacola.');
      return;
    }

    // Estrutura do item
    const itemSacola = {
      id: produtoSelecionado.id,
      nome: produtoSelecionado.nome,
      preco: produtoSelecionado.preco,
      foto: produtoSelecionado.foto,
      tamanho: tamanhoSelecionado || 'Único',
      quantidade: 1
    };

    // Recupera a sacola existente do localStorage
    const sacola = JSON.parse(localStorage.getItem('sacola') || '[]');

    // Verifica se já existe o mesmo produto com o mesmo tamanho
    const indexExistente = sacola.findIndex(
      item => item.id === itemSacola.id && item.tamanho === itemSacola.tamanho
    );

    if (indexExistente > -1) {
      sacola[indexExistente].quantidade += 1;
    } else {
      sacola.push(itemSacola);
    }

    // Salva a lista atualizada
    localStorage.setItem('sacola', JSON.stringify(sacola));

    alert(`"${itemSacola.nome}" ${tamanhoSelecionado ? `(Tamanho: ${tamanhoSelecionado})` : ''} foi adicionado à sacola!`);
    fecharModal();
  }

  // Fechar ao clicar no overlay ou pressionar ESC
  window.onclick = function(event) {
    const modal = document.getElementById('modal-produto');
    if (event.target === modal) {
      fecharModal();
    }
  };

  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
      fecharModal();
    }
  });

  // Inicialização
  document.addEventListener('DOMContentLoaded', carregarProdutos);
</script>


<!-- Modal de Detalhes FINAL -->
<div id="modal-produto" class="modal-overlay hidden">
  <div class="modal-conteudo">
    <button class="fechar-modal" onclick="fecharModal()">&times;</button>
    
    <div class="modal-body">
      <img id="modal-img" src="" alt="Produto" />
      
      <div class="modal-detalhes">
        <div class="detalhes-info">
          <h2 id="modal-titulo"></h2>
          <p id="modal-preco" class="modal-preco"></p>
          <p id="modal-descricao" class="modal-descricao"></p>
          
          <div class="modal-tamanhos-wrapper">
            <label class="label-tamanho">Tamanho:</label>
            <div id="modal-tamanhos" class="container-tamanhos"></div>
          </div>
        </div>
        
        <div class="modal-acoes">
          <button type="button" class="btn-comprar" onclick="adicionarASacola()">Adicionar à Sacola</button>
        </div>
      </div>
    </div>
  </div>
</div>

</div>  
</div>
</body>
</html>
